server.port=8080
spring.application.name=ipo-service

# Expose Actuator endpoints for health check & cloud platforms
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Telegram Bot Configuration
# Pass via environment variable TELEGRAM_BOT_TOKEN or paste your BotFather token below
telegram.bot.enabled=true
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:SandyIpoBot}

# Logging
logging.level.com.ipo.tracker=INFO
